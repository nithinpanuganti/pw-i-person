<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — CivicLens AI</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-primary);
      text-align: center;
      padding: 1.5rem;
    }
    .error-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      max-width: 480px;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div style="font-size: 3.5rem; font-weight: 800; color: var(--teal-400); margin-bottom: 0.5rem;">404</div>
    <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem;">Page Not Found</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
      The page or view you requested does not exist or has moved. CivicLens AI operates as an offline-first single page application.
    </p>
    <a href="index.html" class="btn btn-primary" style="display: inline-block;">Return to Dashboard</a>
  </div>
</body>
</html>
